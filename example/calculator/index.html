<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>reactx calculator</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #11131a;
    --panel: #1b1f2a;
    --key: #272d3b;
    --key-hi: #333b4d;
    --accent: #f0883e;
    --text: #eef1f7;
    --muted: #8b93a7;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 2rem 1rem;
    background: var(--bg);
    color: var(--text);
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  .app { width: min(22rem, 100%); text-align: center; }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .25rem; }
  .lede, .hint { color: var(--muted); font-size: .8rem; margin: 0 0 1.25rem; }
  .hint { margin: 1rem 0 0; }

  .calc {
    background: var(--panel);
    border-radius: 18px;
    padding: 1rem;
    box-shadow: 0 20px 45px rgb(0 0 0 / .45);
  }
  .screen {
    padding: .75rem .5rem 1rem;
    text-align: right;
    overflow: hidden;
  }
  .tape {
    color: var(--muted);
    font-size: .85rem;
    height: 1.4em;
    font-variant-numeric: tabular-nums;
  }
  .value {
    font-size: clamp(1.9rem, 11vw, 2.75rem);
    font-weight: 300;
    letter-spacing: -.02em;
    font-variant-numeric: tabular-nums;
    overflow-wrap: anywhere;
  }
  .value.is-error { color: var(--accent); font-size: 2rem; }

  .keypad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: .5rem;
  }
  .key {
    appearance: none;
    border: 0;
    border-radius: 12px;
    padding: .9rem 0;
    font: inherit;
    font-size: 1.15rem;
    color: var(--text);
    background: var(--key);
    cursor: pointer;
    transition: background .12s ease, transform .06s ease;
  }
  .key:hover { background: var(--key-hi); }
  .key:active { transform: translateY(1px); }
  .key:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .key.fn { background: #323847; color: var(--muted); font-size: 1rem; }
  .key.fn:hover { background: #3c4356; }
  .key.op { background: var(--accent); color: #1a1200; font-weight: 600; }
  .key.op:hover { background: #ff9d55; }
  .key.wide { grid-column: span 2; }
</style>
</head>
<body>
<div id="root"><div class="app"><h1>reactx calculator</h1><p class="lede">Server-rendered in pure Dart, then hydrated. Click the keys or use your keyboard.</p><section class="calc"><div class="screen"><div class="tape"> </div><div class="value">0</div></div><div class="keypad"><button class="key fn" type="button">AC</button><button class="key fn" type="button">±</button><button class="key fn" type="button">%</button><button class="key op" type="button">÷</button><button class="key num" type="button">7</button><button class="key num" type="button">8</button><button class="key num" type="button">9</button><button class="key op" type="button">×</button><button class="key num" type="button">4</button><button class="key num" type="button">5</button><button class="key num" type="button">6</button><button class="key op" type="button">−</button><button class="key num" type="button">1</button><button class="key num" type="button">2</button><button class="key num" type="button">3</button><button class="key op" type="button">+</button><button class="key num wide" type="button">0</button><button class="key num" type="button">.</button><button class="key op equals" type="button">=</button></div></section><p class="hint">Keys: 0-9 . + - * / — Enter to evaluate, Esc to clear, Backspace to delete.</p></div></div>
<script defer src="main.dart.js"></script>
</body>
</html>
